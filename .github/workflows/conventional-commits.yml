name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or execution of PR code; works for fork PRs without secrets.
      - uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: \S[^\r\n]*$/;
            if (!pattern.test(title)) {
              core.setFailed('Use a Conventional Commit title, e.g. feat(display): add brightness control. Squash merge using this title.');
            }
