name: GitHub release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize proposals and publication; never cancel a release in progress.
concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'darti/theopod' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/audit.yml

  release:
    name: Publish GitHub release
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
          version: '0.4.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Prepare release PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: '0.4.1'
        env:
          # A fine-grained PAT lets the generated PR trigger required CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
