[package]
name = "theo-podcasts"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "6487c62bb084c33361822022e21836ddfd48388f", default-features = false }
embassy-futures.workspace = true
heapless = { version = "0.9", default-features = false }
redb.workspace = true
theo-storage.workspace = true
allocator-api2.workspace = true
sha2.workspace = true
littlefs-rust.workspace = true

# Host builds (tests, clippy) use redb's std mode, as in theo-storage.
[target.'cfg(not(target_os = "none"))'.dependencies]
redb = { workspace = true, features = ["std"] }

[dev-dependencies]
theo-storage = { workspace = true, features = ["test-disk"] }
futures = { version = "0.3", features = ["executor"] }
