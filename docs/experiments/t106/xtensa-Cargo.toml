[package]
name = "theo-t106-net"
version = "0.0.0"
edition = "2024"
[dependencies]
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
ekv = { version = "=1.0.0", features = ["crc", "max-page-count-4096", "max-value-size-4096"] }
embassy-sync = "0.8"
redb = { version = "=4.4.0", default-features = false, features = ["experimental-api-5"] }
esp-hal = { version = "~1.2", features = ["esp32s3", "unstable"] }
esp-alloc = { version = "0.11", features = ["esp32s3"] }
esp-rtos = { version = "0.4", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "wifi"] }
embassy-net = { version = "0.9", features = ["tcp", "dhcpv4", "dns", "medium-ethernet"] }
reqwless = { version = "0.14", default-features = false, features = [] }
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "6487c62bb084c33361822022e21836ddfd48388f", default-features = false, features = ["webpki", "p256", "p384", "ed25519", "rsa"] }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = ["embassy-crypto-sha256", "embassy-crypto-sha384", "embassy-crypto-hmac-sha256", "embassy-crypto-hmac-sha384", "embassy-crypto-aes128-gcm", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa", "embassy-crypto-p384-ecdsa", "embassy-crypto-ed25519"] }
embedded-io-async = "0.7"
embassy-sync-06 = { package = "embassy-sync", version = "0.6" }
[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
