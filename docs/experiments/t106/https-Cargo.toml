[package]
name = "theo-t106-https-host"
version = "0.0.0"
edition = "2024"
[dependencies]
reqwless = { version = "0.14", default-features = false, features = [] }
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "6487c62bb084c33361822022e21836ddfd48388f", default-features = false, features = ["std", "webpki", "p256", "p384", "ed25519", "rsa"] }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = ["embassy-crypto-sha256", "embassy-crypto-sha384", "embassy-crypto-hmac-sha256", "embassy-crypto-hmac-sha384", "embassy-crypto-aes128-gcm", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa", "embassy-crypto-p384-ecdsa", "embassy-crypto-ed25519"] }
embedded-io-async = "0.7"
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
embassy-crypto-rand = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
tokio = { version = "1", features = ["full"] }
[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
