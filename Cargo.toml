[workspace]
members = ["crates/theo-drivers", "crates/theo-frame-dump", "tools/frame-png"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
bytemuck = "1"
critical-section = "1.2"
embassy-embedded-hal = { version = "0.6", default-features = false }
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = "0.5"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
esp-alloc = { version = "0.11", features = ["esp32s3"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
# `unstable` exposes the half-duplex QSPI API; keep the `~1.2` pin because
# unstable APIs are outside esp-hal's semver guarantees.
esp-hal = { version = "~1.2", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18", features = ["esp32s3", "log-04"] }
esp-rtos = { version = "0.4", features = ["embassy", "esp32s3"] }
log = "0.4"
png = "0.18"
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
slint-build = "1.18"
speculoos = "0.13"
theo-drivers = { path = "crates/theo-drivers" }
theo-frame-dump = { path = "crates/theo-frame-dump" }

[package]
name = "theo-pod"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
allocator-api2.workspace = true
bytemuck.workspace = true
critical-section.workspace = true
embassy-embedded-hal.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
esp-alloc.workspace = true
esp-backtrace.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-println.workspace = true
esp-rtos.workspace = true
log.workspace = true
slint.workspace = true
theo-drivers.workspace = true
theo-frame-dump = { workspace = true, optional = true }

[features]
# Prints the framebuffer to the serial log after the first frame and after
# each BOOT press; `just frame-png` turns the log into a PNG.
frame-dump = ["dep:theo-frame-dump"]
# Keeps the view upright and logs the raw accelerometer axes once a
# second, to measure `IMU_AXES` (`just imu-calibrate`).
imu-calibration = []

[build-dependencies]
slint-build.workspace = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = 2

[profile.dev]
debug = 2
opt-level = "s"
